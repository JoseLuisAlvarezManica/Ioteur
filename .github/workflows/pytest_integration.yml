name: Pytest — Integration Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  REGISTER_BASE_URL: http://localhost:8005

jobs:
  pytest-integration:
    runs-on: ubuntu-latest
    environment: workflows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          {
            echo "LOG_LEVEL=INFO"
            echo "POSTGRES_AUTH_USER=${{ secrets.POSTGRES_AUTH_USER }}"
            echo "POSTGRES_AUTH_PASSWORD=${{ secrets.POSTGRES_AUTH_PASSWORD }}"
            echo "POSTGRES_AUTH_DB=${{ secrets.POSTGRES_AUTH_DB }}"
            echo "POSTGRES_AUTH_DATABASE_URL=${{ secrets.POSTGRES_AUTH_DATABASE_URL }}"
            echo "REDIS_AUTH_URL=redis://redis-auth:6379/0"
            echo "ACCESS_TOKEN_EXPIRE_MINUTES=15"
            echo "REFRESH_TOKEN_EXPIRE_DAYS=7"
            echo "AUTH_SERVICE_URL=http://auth-service:8001"
            echo "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}"
            echo "RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}"
            echo "RABBITMQ_URL=amqp://${{ secrets.RABBITMQ_USER }}:${{ secrets.RABBITMQ_PASSWORD }}@rabbitmq:5672/"
            echo "MONGO_REGISTER_USER=${{ secrets.MONGO_REGISTER_USER }}"
            echo "MONGO_REGISTER_PASSWORD=${{ secrets.MONGO_REGISTER_PASSWORD }}"
            echo "MONGO_REGISTER_DB=${{ secrets.MONGO_REGISTER_DB }}"
            echo "MONGO_REGISTER_URL=mongodb://${{ secrets.MONGO_REGISTER_USER }}:${{ secrets.MONGO_REGISTER_PASSWORD }}@mongo_register:27017/${{ secrets.MONGO_REGISTER_DB }}?authSource=admin"
          } > .env

          printf 'PRIVATE_KEY=%s\n' "${{ secrets.PRIVATE_KEY }}" >> .env
          printf 'PUBLIC_KEY=%s\n' "${{ secrets.PUBLIC_KEY }}" >> .env

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

      - name: Wait for register-service to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8005/health > /dev/null; then
              echo "register-service is up"
              break
            fi
            echo "Waiting for register-service... ($i/30)"
            if [ "$i" -eq 30 ]; then
              echo "register-service failed to start"
              docker compose logs register-service
              exit 1
            fi
            sleep 3
          done

      - name: Install Python test dependencies
        run: pip install --break-system-packages aio-pika httpx pytest pytest-asyncio

      - name: Run register pytest tests
        env:
          RABBITMQ_URL: amqp://${{ secrets.RABBITMQ_USER }}:${{ secrets.RABBITMQ_PASSWORD }}@localhost:5672/
          REGISTER_BASE_URL: http://localhost:8005
        run: pytest .github/workflows/pytest_tests/test_register_flow.py -v

      - name: Print register-service logs on failure
        if: failure()
        run: docker compose logs register-service

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.yml down -v
