services:
  postgres-auth:
    restart: always
  redis-auth:
    restart: always

  postgres-device:
    restart: always
  redis-device:
    restart: always

  rabbitmq:
    restart: always
    image: rabbitmq:4-alpine

  api-gateway:
    ports:
      - "80:8000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  
  auth-service:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  call-service:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  device-service:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  notification-service:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  register-service:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  telemetry-service:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
