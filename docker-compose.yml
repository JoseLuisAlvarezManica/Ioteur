services:
  api-gateway:
    build: ./services/api-gateway
    env_file: ${ENV_FILE:-.env}
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else exit(1)"]
      interval: 30s
      retries: 3
      start_period: 10s
  
